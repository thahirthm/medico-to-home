# CI: every push and pull request is type-checked, linted, tested and built.
# CD: a push to main that passes CI is deployed to the Hostinger VPS (https://medicotohome.com).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: medico-to-home-app

jobs:
  ci:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so the build can run; the real values live only on the server.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medico-to-home-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: bash deploy/linux-natives.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time; a newer push waits for the running one to finish.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://medicotohome.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_SSH_KEY" && test -n "$VPS_HOST" || { echo "Add the VPS_SSH_KEY and VPS_HOST secrets in GitHub"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # The server's own key, pinned so the deploy cannot be sent to an impostor.
          echo "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOyc7bgr7gnrTUIwTkrG+Xbi/mCqCxokM0wfzj1TLcUB" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          SERVER: root@${{ secrets.VPS_HOST }}
        run: bash deploy/deploy.sh
      - name: Check the live site
        run: |
          curl -fsS https://api.medicotohome.com/health
          curl -fsS -o /dev/null -w "website: %{http_code}\n" https://medicotohome.com/
